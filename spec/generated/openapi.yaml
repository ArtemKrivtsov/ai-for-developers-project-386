openapi: 3.0.0
info:
  title: Calendar API
  version: 0.0.0
tags: []
paths:
  /api/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/meeting-types:
    get:
      operationId: listMeetingTypes
      description: Lists meeting types in creation order.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
    post:
      operationId: createMeetingType
      description: Creates a meeting type at the end of the list.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The request breaks the contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMeetingType'
  /api/meeting-types/{meetingTypeId}:
    get:
      operationId: getMeetingType
      description: 'Reads one meeting type. An id that is not a UUID fails validation with `field: meetingTypeId`.'
      parameters:
        - name: meetingTypeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The request breaks the contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No meeting type has the id from the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/meeting-types/{meetingTypeId}/meetings:
    post:
      operationId: createMeeting
      description: |-
        Books a meeting of the type. `start` must be one of the slots the server would list for it
        right now. A start that no slot has even without other meetings fails validation with
        `field: start`, and a start whose slot overlaps another meeting gets `conflict`.
      parameters:
        - name: meetingTypeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          description: The request breaks the contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No meeting type has the id from the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The time overlaps a meeting that already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMeeting'
  /api/meeting-types/{meetingTypeId}/slots:
    get:
      operationId: listSlots
      description: Lists the slots of a meeting type for each of the 14 days of the booking window, from tomorrow.
      parameters:
        - name: meetingTypeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotDay'
        '400':
          description: The request breaks the contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No meeting type has the id from the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - validation_error
            - meeting_type_not_found
            - conflict
        message:
          type: string
          description: An explanation in English for developers, not meant for the user interface.
        field:
          type: string
          description: |-
            The first field that failed validation: a body property or a path parameter.
            Only `validation_error` has it, and not when the body is not valid JSON.
      description: Why the server refused the request.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Meeting:
      type: object
      required:
        - id
        - meetingType
        - start
        - end
        - guestName
        - guestEmail
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        meetingType:
          allOf:
            - $ref: '#/components/schemas/MeetingType'
          description: The whole meeting type, so a list of meetings needs no more requests.
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: The start plus the duration of the meeting type.
        guestName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        guestEmail:
          type: string
          maxLength: 254
          format: email
      description: A guest's meeting with the owner. Times are Moscow time, like `2026-11-10T09:00:00+03:00`.
    MeetingType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        description:
          type: string
          maxLength: 500
          description: An empty string means the meeting type has no description.
        durationMinutes:
          type: number
          enum:
            - 15
            - 30
            - 45
            - 60
            - 90
            - 120
      description: A kind of meeting the owner offers to guests.
    NewMeeting:
      type: object
      required:
        - start
        - guestName
        - guestEmail
      properties:
        start:
          type: string
          format: date-time
        guestName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        guestEmail:
          type: string
          maxLength: 254
          format: email
      description: |-
        What the guest fills in to book a meeting. `start` is compared with the slots as a moment, so
        any offset works. The server trims `guestName` and keeps `guestEmail` as it is.
    NewMeetingType:
      type: object
      required:
        - name
        - durationMinutes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        durationMinutes:
          type: number
          enum:
            - 15
            - 30
            - 45
            - 60
            - 90
            - 120
        description:
          type: string
          maxLength: 500
          description: Omitted or empty when the meeting type has no description.
      description: What the owner fills in to create a meeting type. The server trims `name` and `description`.
    Slot:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: The start plus the duration of the meeting type.
      description: |-
        Free time a meeting of the type can start at. The server gives times in Moscow time,
        like `2026-11-10T09:00:00+03:00`.
    SlotDay:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
          description: Slots in start order, empty on weekends and on days with no free time.
      description: A day of the booking window, in Moscow time.
    uuid:
      type: string
      format: uuid
