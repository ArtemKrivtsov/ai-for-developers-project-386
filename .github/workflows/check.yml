name: check

on: push

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
      - run: pnpm install --frozen-lockfile
      - run: mise run check
      - name: Check commit messages
        env:
          FROM: ${{ github.event.before }}
          TO: ${{ github.sha }}
        # A new branch or a force push leaves no usable "before" commit: check the last one only.
        run: |
          if git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "$FROM" --to "$TO" --verbose
          else
            pnpm exec commitlint --last --verbose
          fi
